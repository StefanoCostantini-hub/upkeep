<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upkeep — Building Maintenance Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2733;
    --ink-2:#28374A;
    --concrete:#EDEBE2;
    --paper:#FBFAF6;
    --steel:#57636F;
    --steel-light:#A9AFA6;
    --line:#D9D6C9;
    --amber:#E2A73E;
    --amber-ink:#5B3E0C;
    --red:#C2453A;
    --red-ink:#5A150F;
    --green:#4C7A5D;
    --green-ink:#173A25;
    --radius:10px;
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--concrete);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Archivo Narrow',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* header */
  header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:3px solid var(--amber);
  }
  .header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border:2px solid var(--amber);border-radius:6px;
    display:flex;align-items:center;justify-content:center;color:var(--amber);
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;
  }
  .brand-name{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:19px;letter-spacing:0.2px;}
  #buildingName{
    background:transparent;border:none;color:var(--steel-light);
    font-size:12px;font-family:'IBM Plex Mono',monospace;padding:0;
    width:150px;text-align:right;
  }
  #buildingName:focus{outline:none;color:var(--paper);}

  nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto;}
  .tab{
    flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:600;
    color:var(--steel-light);background:transparent;border:none;border-radius:7px 7px 0 0;
    font-family:'Archivo Narrow',sans-serif;letter-spacing:0.3px;white-space:nowrap;
  }
  .tab.active{background:var(--concrete);color:var(--ink);}

  main{padding:16px;max-width:640px;margin:0 auto;padding-bottom:90px;}
  .view{display:none;}
  .view.active{display:block;}

  /* stat strip */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .stat{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 8px;text-align:center;
  }
  .stat.overdue{border-color:var(--red);}
  .stat-num{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:26px;line-height:1;}
  .stat.overdue .stat-num{color:var(--red);}
  .stat.dueSoon .stat-num{color:var(--amber-ink);}
  .stat-label{font-size:10.5px;color:var(--steel);text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}

  h2.section-title{
    font-family:'Archivo Narrow',sans-serif;font-size:14px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.6px;color:var(--steel);
    margin:22px 0 10px;display:flex;align-items:center;gap:8px;
  }
  h2.section-title::after{content:"";flex:1;height:1px;background:var(--line);}

  /* task tag card */
  .tag{
    position:relative;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 14px 14px 30px;margin-bottom:10px;
    border-left:4px solid var(--steel-light);
  }
  .tag.status-overdue{border-left-color:var(--red);}
  .tag.status-soon{border-left-color:var(--amber);}
  .tag.status-ok{border-left-color:var(--green);}
  .tag-hole{
    position:absolute;left:11px;top:16px;width:8px;height:8px;border-radius:50%;
    background:var(--concrete);border:1px solid var(--steel-light);
  }
  .tag-hole::after{
    content:"";position:absolute;left:8px;top:3px;width:14px;height:1px;
    background:repeating-linear-gradient(90deg,var(--steel-light) 0 3px,transparent 3px 6px);
  }
  .tag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tag-title{font-weight:600;font-size:15px;line-height:1.3;}
  .tag-meta{font-size:12px;color:var(--steel);margin-top:3px;}
  .tag-meta .mono{font-size:11.5px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;
    padding:3px 7px;border-radius:5px;white-space:nowrap;text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .badge.overdue{background:rgba(194,69,58,0.12);color:var(--red-ink);}
  .badge.soon{background:rgba(226,167,62,0.18);color:var(--amber-ink);}
  .badge.ok{background:rgba(76,122,93,0.13);color:var(--green-ink);}
  .perf-chip{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 7px;
    border-radius:5px;white-space:nowrap;border:1px solid var(--line);color:var(--steel);
  }
  .perf-chip.engineer{background:rgba(87,99,111,0.1);border-color:var(--steel-light);color:var(--ink-2);}
  .perf-chip.vendor{background:rgba(28,39,51,0.06);border-color:var(--line);color:var(--steel);}
  .jump-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px;}
  .system-section{margin-bottom:4px;}
  .system-header{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:20px 0 10px;scroll-margin-top:120px;
  }
  .system-header .name{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:15px;
    text-transform:uppercase;letter-spacing:0.5px;
  }
  .system-header .count{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);}

  /* desk calendar */
  .week-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:4px;}
  .day-tile{
    flex:0 0 auto;width:58px;background:var(--paper);border:1px solid var(--line);
    border-radius:8px;overflow:hidden;text-align:center;cursor:pointer;scroll-margin-top:120px;
  }
  .day-tile .tab-strip{height:5px;background:var(--steel-light);}
  .day-tile.today{border-color:var(--ink);}
  .day-tile.today .tab-strip{background:var(--amber);}
  .day-tile .dow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--steel);text-transform:uppercase;padding-top:6px;letter-spacing:0.5px;}
  .day-tile .num{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:21px;line-height:1.15;margin:1px 0;}
  .day-tile.today .num{color:var(--amber-ink);}
  .day-tile .count{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--steel-light);padding-bottom:7px;}
  .day-tile .count.has-work{color:var(--steel);}
  .day-tile .count.has-overdue{color:var(--red);}
  .agenda-day-header{
    font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12.5px;margin:16px 0 8px;
    scroll-margin-top:120px;color:var(--steel);text-transform:uppercase;letter-spacing:0.4px;
  }
  .agenda-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--paper);
    border:1px solid var(--line);border-left:3px solid var(--steel-light);border-radius:6px;
    padding:8px 10px;margin-bottom:6px;font-size:13px;cursor:pointer;
  }
  .agenda-row.status-overdue{border-left-color:var(--red);}
  .agenda-row.status-soon{border-left-color:var(--amber);}
  .agenda-row .t{font-weight:600;}
  .agenda-row .c{font-size:11px;color:var(--steel);margin-top:1px;}
  .stamp{
    display:inline-block;margin-top:9px;font-family:'Archivo Narrow',sans-serif;
    font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--red);border:1.5px solid var(--red);border-radius:4px;
    padding:2px 7px;transform:rotate(-3deg);opacity:0.85;
  }
  .tag-notes{font-size:12.5px;color:var(--steel);margin-top:8px;line-height:1.4;}
  .tag-actions{display:flex;gap:8px;margin-top:12px;}
  .btn{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:7px;border:1px solid var(--line);
    background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn.danger-outline{color:var(--red);border-color:rgba(194,69,58,0.4);}
  .btn:active{transform:scale(0.97);}

  .empty{
    text-align:center;padding:34px 18px;color:var(--steel);font-size:13.5px;
    background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* filters */
  .filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:6px 11px;
    border-radius:20px;border:1px solid var(--line);background:var(--paper);
    color:var(--steel);white-space:nowrap;flex-shrink:0;
  }
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .filters.wrap{flex-wrap:wrap;overflow-x:visible;}
  .filters.wrap .chip{cursor:pointer;}

  /* log entries */
  .log-entry{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;
  }
  .log-top{display:flex;justify-content:space-between;gap:8px;}
  .log-title{font-weight:600;font-size:14px;}
  .log-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);white-space:nowrap;}
  .log-by{font-size:12px;color:var(--steel);margin-top:2px;}
  .log-notes{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.4;}

  /* fab */
  .fab{
    position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;
    background:var(--amber);color:var(--ink);border:none;font-size:26px;font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);z-index:15;cursor:pointer;line-height:1;
  }
  .fab:active{transform:scale(0.95);}

  /* modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,26,33,0.55);z-index:30;
    align-items:flex-end;justify-content:center;
  }
  .overlay.active{display:flex;}
  .sheet{
    background:var(--concrete);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;padding:18px 18px 26px;
  }
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
  .sheet h3{font-family:'Archivo Narrow',sans-serif;font-size:18px;margin:0 0 16px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin:14px 0 5px;text-transform:uppercase;letter-spacing:0.4px;}
  input,select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper);color:var(--ink);font-size:14.5px;font-family:'Inter',sans-serif;
  }
  textarea{resize:vertical;min-height:56px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sheet-actions{display:flex;gap:10px;margin-top:20px;}
  .sheet-actions .btn{flex:1;padding:11px;text-align:center;}
  .err{color:var(--red);font-size:12px;margin-top:4px;display:none;}

  @media (max-width:400px){
    .stats{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">U</div>
      <div class="brand-name">Upkeep</div>
    </div>
    <input id="buildingName" type="text" value="123 Main St" spellcheck="false">
  </div>
  <nav>
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="tasks">Tasks</button>
    <button class="tab" data-view="log">Log</button>
  </nav>
</header>

<main>

  <div class="view active" id="view-dashboard">
    <h2 class="section-title" style="margin-top:0;">This week</h2>
    <div class="week-strip" id="weekStrip"></div>
    <div id="weekAgenda"></div>

    <div class="stats">
      <div class="stat overdue"><div class="stat-num" id="statOverdue">0</div><div class="stat-label">Overdue</div></div>
      <div class="stat dueSoon"><div class="stat-num" id="statSoon">0</div><div class="stat-label">Due 7 days</div></div>
      <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Active</div></div>
    </div>

    <h2 class="section-title">Overdue</h2>
    <div id="listOverdue"></div>

    <h2 class="section-title">Due this week</h2>
    <div id="listSoon"></div>

    <h2 class="section-title">Recently logged</h2>
    <div id="listRecent"></div>
  </div>

  <div class="view" id="view-tasks">
    <div class="jump-row" id="jumpRow"></div>
    <div class="filters" id="perfFilters">
      <button class="chip active" data-perf="All">All</button>
      <button class="chip" data-perf="engineer">Building engineer</button>
      <button class="chip" data-perf="vendor">Outside vendor</button>
    </div>
    <div id="listAllTasks"></div>
  </div>

  <div class="view" id="view-log">
    <div id="listLog"></div>
  </div>

</main>

<button class="fab" id="fabAdd" aria-label="Add task">+</button>

<div class="overlay" id="overlayForm">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="formTitle">New maintenance task</h3>
    <form id="taskForm">
      <label for="fTitle">Task</label>
      <input id="fTitle" type="text" placeholder="Replace HVAC filters, Floor 4 AHU">
      <div class="err" id="errTitle">Enter a task name</div>

      <div class="row2">
        <div>
          <label for="fCategory">Building system</label>
          <select id="fCategory">
            <option>HVAC</option>
            <option>Electrical</option>
            <option>Plumbing</option>
            <option>Fire Prevention</option>
            <option>Elevators</option>
            <option>Landscaping</option>
            <option>Atrium Landscape</option>
            <option>Structural &amp; Exterior</option>
            <option>General</option>
          </select>
        </div>
        <div>
          <label for="fFrequency">Frequency</label>
          <select id="fFrequency">
            <option value="0">One-time</option>
            <option value="7">Weekly</option>
            <option value="14">Biweekly</option>
            <option value="30" selected>Monthly</option>
            <option value="90">Quarterly</option>
            <option value="182">Semiannual</option>
            <option value="365">Annual</option>
          </select>
        </div>
      </div>

      <label for="fLocation">Location / asset</label>
      <input id="fLocation" type="text" placeholder="Roof AHU-3, Suite 400 panel, Lobby elevator">

      <label id="suggestLabel" style="margin-top:14px;">Common HVAC tasks</label>
      <div class="filters wrap" id="taskSuggestions" style="margin-bottom:2px;"></div>

      <div class="row2">
        <div>
          <label for="fDue">Next due</label>
          <input id="fDue" type="date">
          <div class="err" id="errDue">Set a due date</div>
        </div>
        <div>
          <label for="fPerformedBy">Performed by</label>
          <select id="fPerformedBy">
            <option value="engineer">Building engineer</option>
            <option value="vendor">Outside vendor</option>
          </select>
        </div>
      </div>

      <label for="fAssignee" id="fAssigneeLabel">Engineer name</label>
      <input id="fAssignee" type="text" placeholder="e.g. Marcus">

      <label for="fNotes">Notes</label>
      <textarea id="fNotes" placeholder="Specs, part numbers, access instructions..."></textarea>

      <div class="sheet-actions">
        <button type="button" class="btn" id="btnCancelForm">Cancel</button>
        <button type="submit" class="btn primary">Save task</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="overlayComplete">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>Log completion</h3>
    <div id="completeTaskName" style="font-weight:600;font-size:14px;margin-bottom:4px;"></div>
    <form id="completeForm">
      <label for="cBy">Completed by</label>
      <input id="cBy" type="text" placeholder="Name or vendor">
      <div class="err" id="errBy">Enter who completed this</div>

      <label for="cDate">Date completed</label>
      <input id="cDate" type="date">

      <label for="cNotes">Notes</label>
      <textarea id="cNotes" placeholder="Condition found, parts used, follow-ups..."></textarea>

      <div class="sheet-actions">
        <button type="button" class="btn" id="btnCancelComplete">Cancel</button>
        <button type="submit" class="btn primary">Log & schedule next</button>
      </div>
    </form>
  </div>
</div>

<script>
let DATA = { tasks: [], log: [], buildingName: "123 Main St" };
let currentPerfFilter = "All";
let pendingCompleteId = null;
const STORAGE_KEY = "upkeep-data";
const CATEGORIES = ["HVAC","Electrical","Plumbing","Fire Prevention","Elevators","Landscaping","Atrium Landscape","Structural & Exterior","General"];
const TASK_LIBRARY = {
  "HVAC": [
    "Replace air filters","Inspect belts and pulleys","Check refrigerant levels",
    "Clean condenser coils","Test economizer operation","Calibrate thermostat / BMS setpoints",
    "Inspect cooling tower","Lubricate motors and bearings"
  ],
  "Electrical": [
    "Thermal imaging scan of panels","Test emergency generator","Inspect UPS battery health",
    "Torque check electrical connections","Test GFCI outlets","Inspect lighting / replace lamps",
    "Load bank test generator"
  ],
  "Plumbing": [
    "Inspect backflow preventer","Flush water heater","Check sump pump operation",
    "Inspect restroom fixtures for leaks","Test irrigation backflow device","Clean grease trap"
  ],
  "Fire Prevention": [
    "Backup battery voltage check","Semi-annual system test","Inspect fire extinguishers",
    "Test sprinkler system flow","Inspect fire pump","Smoke detector sensitivity test",
    "Standpipe hose inspection","Kitchen hood suppression inspection"
  ],
  "Elevators": [
    "Monthly safety inspection","Annual state inspection","Lubricate rails and cables",
    "Test emergency phone line","Inspect door sensors"
  ],
  "Landscaping": [
    "Mow and edge lawn","Seasonal fertilization","Irrigation system check",
    "Prune trees and shrubs","Refresh mulch beds","Leaf / debris removal"
  ],
  "Atrium Landscape": [
    "Water interior plants","Inspect plant health / pests","Clean atrium glazing",
    "Rotate seasonal plantings","Check drip irrigation lines"
  ],
  "Structural & Exterior": [
    "Inspect roof membrane","Clean gutters and downspouts","Pressure wash exterior",
    "Inspect facade / caulking","Parking lot striping / seal coat","Inspect expansion joints"
  ],
  "General": [
    "Pest control service","Trash / recycling area cleanout","Restock janitorial supplies",
    "Building walkthrough inspection"
  ]
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function fmtDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function daysUntil(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function statusOf(task){
  const du = daysUntil(task.nextDue);
  if (du < 0) return "overdue";
  if (du <= 7) return "soon";
  return "ok";
}

async function loadData(){
  try{
    let value = null;

    // 1. Shared network API (when hosted behind server.js, e.g. on a NAS)
    try{
      const r = await fetch('/api/data', {cache:'no-store'});
      if (r.ok) value = await r.text();
    }catch(e){ /* no server API reachable, fall through */ }

    // 2. Claude.ai artifact storage
    if (value === null && window.storage && typeof window.storage.get === 'function'){
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res && res.value) value = res.value;
    }

    // 3. Per-device localStorage (last resort)
    if (value === null) value = localStorage.getItem(STORAGE_KEY);

    if (value){
      const parsed = JSON.parse(value);
      DATA = Object.assign({tasks:[],log:[],buildingName:"123 Main St"}, parsed);
    }
  }catch(e){
    console.log("No existing data, starting fresh", e);
  }
  document.getElementById('buildingName').value = DATA.buildingName;
  renderAll();
}

async function saveData(){
  const json = JSON.stringify(DATA);

  // 1. Shared network API first
  try{
    const r = await fetch('/api/data', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: json
    });
    if (r.ok) return;
  }catch(e){ /* no server API reachable, fall through */ }

  // 2. Claude.ai artifact storage
  try{
    if (window.storage && typeof window.storage.set === 'function'){
      const res = await window.storage.set(STORAGE_KEY, json, false);
      if (res) return;
    }
  }catch(e){
    console.error("window.storage save failed", e);
  }

  // 3. Per-device localStorage fallback
  try{
    localStorage.setItem(STORAGE_KEY, json);
  }catch(e){
    console.error("localStorage save also failed", e);
  }
}

// When hosted on a shared server, poll periodically so teammates' changes show up
// without a manual refresh. Silently does nothing if no server API is present.
setInterval(async () => {
  const formOpen = document.getElementById('overlayForm').classList.contains('active');
  const completeOpen = document.getElementById('overlayComplete').classList.contains('active');
  if (formOpen || completeOpen) return; // don't clobber a form in progress
  try{
    const r = await fetch('/api/data', {cache:'no-store'});
    if (!r.ok) return;
    const parsed = JSON.parse(await r.text());
    DATA = Object.assign({tasks:[],log:[],buildingName:"123 Main St"}, parsed);
    document.getElementById('buildingName').value = DATA.buildingName;
    renderAll();
  }catch(e){ /* no server API reachable — ignore */ }
}, 20000);

function renderAll(){
  renderDashboard();
  renderTasksView();
  renderLogView();
}

function taskTagHTML(task, opts){
  opts = opts || {};
  const status = statusOf(task);
  const du = daysUntil(task.nextDue);
  let badgeText, badgeClass;
  if (status === "overdue"){ badgeText = Math.abs(du) + "d overdue"; badgeClass = "overdue"; }
  else if (status === "soon"){ badgeText = du === 0 ? "due today" : du + "d left"; badgeClass = "soon"; }
  else { badgeText = fmtDate(task.nextDue); badgeClass = "ok"; }

  const freqLabel = {0:"one-time",7:"weekly",14:"biweekly",30:"monthly",90:"quarterly",182:"semiannual",365:"annual"}[task.frequency] || "";

  return `
  <div class="tag status-${status}" data-id="${task.id}">
    <div class="tag-hole"></div>
    <div class="tag-top">
      <div>
        <div class="tag-title">${escapeHTML(task.title)}</div>
        <div class="tag-meta">${escapeHTML(task.location || 'no location set')}</div>
        <div class="tag-meta mono">${freqLabel}${task.assignee ? ' · ' + escapeHTML(task.assignee) : ''}</div>
      </div>
      <div class="badge ${badgeClass}">${badgeText}</div>
    </div>
    <span class="perf-chip ${task.performedBy === 'vendor' ? 'vendor' : 'engineer'}" style="display:inline-block;margin-top:8px;">${task.performedBy === 'vendor' ? 'outside vendor' : 'building engineer'}</span>
    ${status === 'overdue' ? '<div class="stamp">overdue</div>' : ''}
    ${task.notes ? `<div class="tag-notes">${escapeHTML(task.notes)}</div>` : ''}
    <div class="tag-actions">
      <button class="btn primary" onclick="openComplete('${task.id}')">Mark complete</button>
      <button class="btn danger-outline" onclick="deleteTask('${task.id}')">Delete</button>
    </div>
  </div>`;
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str || "";
  return d.innerHTML;
}

function agendaRowHTML(task, status){
  return `<div class="agenda-row status-${status}" onclick="openComplete('${task.id}')">
    <div>
      <div class="t">${escapeHTML(task.title)}</div>
      <div class="c">${escapeHTML(task.category)}${task.location ? ' · ' + escapeHTML(task.location) : ''}</div>
    </div>
    <span class="perf-chip ${task.performedBy === 'vendor' ? 'vendor' : 'engineer'}">${task.performedBy === 'vendor' ? 'vendor' : 'engineer'}</span>
  </div>`;
}

function renderWeek(){
  const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const start = new Date(); start.setHours(0,0,0,0);
  const overdueTasks = DATA.tasks.filter(t => statusOf(t) === 'overdue').sort((a,b)=>a.nextDue.localeCompare(b.nextDue));

  let stripHTML = '', agendaHTML = '';
  for (let i = 0; i < 7; i++){
    const d = new Date(start); d.setDate(d.getDate() + i);
    const dateStr = d.toISOString().slice(0,10);
    const dayTasks = DATA.tasks.filter(t => t.nextDue === dateStr).sort((a,b)=>a.title.localeCompare(b.title));
    const isToday = i === 0;
    const count = dayTasks.length + (isToday ? overdueTasks.length : 0);
    const anchorId = 'day-' + dateStr;

    stripHTML += `<div class="day-tile ${isToday ? 'today' : ''}" data-jump="${anchorId}">
      <div class="tab-strip"></div>
      <div class="dow">${dowNames[d.getDay()]}</div>
      <div class="num">${d.getDate()}</div>
      <div class="count ${count ? 'has-work' : ''} ${isToday && overdueTasks.length ? 'has-overdue' : ''}">${count ? count + (count === 1 ? ' task' : ' tasks') : '—'}</div>
    </div>`;

    if (count > 0){
      agendaHTML += `<div class="agenda-day-header" id="${anchorId}">${dowNames[d.getDay()]} ${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>`;
      if (isToday && overdueTasks.length) agendaHTML += overdueTasks.map(t => agendaRowHTML(t,'overdue')).join('');
      agendaHTML += dayTasks.map(t => agendaRowHTML(t, statusOf(t))).join('');
    }
  }

  document.getElementById('weekStrip').innerHTML = stripHTML;
  document.getElementById('weekAgenda').innerHTML = agendaHTML || '<div class="empty">Nothing on the calendar this week.</div>';
}

function renderDashboard(){
  renderWeek();
  const active = DATA.tasks;
  const overdue = active.filter(t => statusOf(t) === "overdue").sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  const soon = active.filter(t => statusOf(t) === "soon").sort((a,b)=>a.nextDue.localeCompare(b.nextDue));

  document.getElementById('statOverdue').textContent = overdue.length;
  document.getElementById('statSoon').textContent = soon.length;
  document.getElementById('statTotal').textContent = active.length;

  document.getElementById('listOverdue').innerHTML = overdue.length
    ? overdue.map(t => taskTagHTML(t)).join('')
    : '<div class="empty">Nothing overdue. Good shape.</div>';

  document.getElementById('listSoon').innerHTML = soon.length
    ? soon.map(t => taskTagHTML(t)).join('')
    : '<div class="empty">Nothing due in the next 7 days.</div>';

  const recent = [...DATA.log].sort((a,b)=>b.completedDate.localeCompare(a.completedDate)).slice(0,3);
  document.getElementById('listRecent').innerHTML = recent.length
    ? recent.map(logEntryHTML).join('')
    : '<div class="empty">No completions logged yet.</div>';
}

function renderTasksView(){
  let list = DATA.tasks;
  if (currentPerfFilter !== "All") list = list.filter(t => (t.performedBy||'engineer') === currentPerfFilter);

  const presentCats = CATEGORIES.filter(c => DATA.tasks.some(t => t.category === c));
  document.getElementById('jumpRow').innerHTML = presentCats.map(c =>
    `<button class="chip" data-jump="${escapeHTML(c)}">${escapeHTML(c)}</button>`
  ).join('');

  if (!list.length){
    document.getElementById('listAllTasks').innerHTML = '<div class="empty">No tasks here. Tap + to add one.</div>';
    return;
  }

  let html = '';
  presentCats.forEach(cat => {
    const catTasks = list.filter(t => t.category === cat).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
    if (!catTasks.length) return;
    html += `<div class="system-section">
      <div class="system-header" id="cat-${escapeHTML(cat.replace(/\s+/g,'-'))}">
        <span class="name">${escapeHTML(cat)}</span>
        <span class="count">${catTasks.length} task${catTasks.length===1?'':'s'}</span>
      </div>
      ${catTasks.map(t => taskTagHTML(t)).join('')}
    </div>`;
  });
  document.getElementById('listAllTasks').innerHTML = html || '<div class="empty">No tasks match this filter.</div>';
}

function logEntryHTML(entry){
  return `
  <div class="log-entry">
    <div class="log-top">
      <div class="log-title">${escapeHTML(entry.taskTitle)}</div>
      <div class="log-date mono">${fmtDate(entry.completedDate)}</div>
    </div>
    <div class="log-by">Completed by ${escapeHTML(entry.completedBy)}</div>
    ${entry.notes ? `<div class="log-notes">${escapeHTML(entry.notes)}</div>` : ''}
  </div>`;
}

function renderLogView(){
  const sorted = [...DATA.log].sort((a,b)=>b.completedDate.localeCompare(a.completedDate));
  document.getElementById('listLog').innerHTML = sorted.length
    ? sorted.map(logEntryHTML).join('')
    : '<div class="empty">Completed tasks will appear here once you log them.</div>';
}

// week strip jump
document.getElementById('weekStrip').addEventListener('click', (e) => {
  const tile = e.target.closest('.day-tile');
  if (!tile) return;
  const target = document.getElementById(tile.dataset.jump);
  if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
});

// tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
  });
});

// jump-to-system chips
document.getElementById('jumpRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const target = document.getElementById('cat-' + btn.dataset.jump.replace(/\s+/g,'-'));
  if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
});

// performer filter chips
document.getElementById('perfFilters').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  currentPerfFilter = btn.dataset.perf;
  document.querySelectorAll('#perfFilters .chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  renderTasksView();
});

// task suggestion chips per category
function renderTaskSuggestions(){
  const cat = document.getElementById('fCategory').value;
  document.getElementById('suggestLabel').textContent = 'Common ' + cat + ' tasks';
  const tasks = TASK_LIBRARY[cat] || [];
  document.getElementById('taskSuggestions').innerHTML = tasks.map(t =>
    `<button type="button" class="chip" data-task="${escapeHTML(t)}">${escapeHTML(t)}</button>`
  ).join('');
}
document.getElementById('fCategory').addEventListener('change', renderTaskSuggestions);
document.getElementById('taskSuggestions').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.getElementById('fTitle').value = btn.dataset.task;
  document.getElementById('errTitle').style.display = 'none';
  document.querySelectorAll('#taskSuggestions .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
});

// toggle assignee label based on performed-by selection
function syncAssigneeLabel(){
  const isVendor = document.getElementById('fPerformedBy').value === 'vendor';
  document.getElementById('fAssigneeLabel').textContent = isVendor ? 'Vendor name' : 'Engineer name';
  document.getElementById('fAssignee').placeholder = isVendor ? 'e.g. ClimateTech Services' : 'e.g. Marcus';
}
document.getElementById('fPerformedBy').addEventListener('change', syncAssigneeLabel);

// building name persistence
document.getElementById('buildingName').addEventListener('change', (e) => {
  DATA.buildingName = e.target.value.trim() || "Building";
  saveData();
});

// add task form
const overlayForm = document.getElementById('overlayForm');
document.getElementById('fabAdd').addEventListener('click', () => {
  document.getElementById('taskForm').reset();
  document.getElementById('fFrequency').value = "30";
  document.getElementById('fDue').value = todayStr();
  document.getElementById('fPerformedBy').value = "engineer";
  syncAssigneeLabel();
  document.getElementById('fCategory').value = "HVAC";
  renderTaskSuggestions();
  document.getElementById('errTitle').style.display = 'none';
  document.getElementById('errDue').style.display = 'none';
  overlayForm.classList.add('active');
});
document.getElementById('btnCancelForm').addEventListener('click', () => overlayForm.classList.remove('active'));
overlayForm.addEventListener('click', (e) => { if (e.target === overlayForm) overlayForm.classList.remove('active'); });

document.getElementById('taskForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = document.getElementById('fTitle').value.trim();
  const due = document.getElementById('fDue').value;
  let valid = true;
  if (!title){ document.getElementById('errTitle').style.display = 'block'; valid = false; }
  else document.getElementById('errTitle').style.display = 'none';
  if (!due){ document.getElementById('errDue').style.display = 'block'; valid = false; }
  else document.getElementById('errDue').style.display = 'none';
  if (!valid) return;

  const task = {
    id: uid(),
    title,
    category: document.getElementById('fCategory').value,
    frequency: parseInt(document.getElementById('fFrequency').value, 10),
    location: document.getElementById('fLocation').value.trim(),
    nextDue: due,
    performedBy: document.getElementById('fPerformedBy').value,
    assignee: document.getElementById('fAssignee').value.trim(),
    notes: document.getElementById('fNotes').value.trim()
  };
  DATA.tasks.push(task);
  saveData();
  renderAll();
  overlayForm.classList.remove('active');
});

// complete task flow
const overlayComplete = document.getElementById('overlayComplete');
function openComplete(id){
  const task = DATA.tasks.find(t => t.id === id);
  if (!task) return;
  pendingCompleteId = id;
  document.getElementById('completeTaskName').textContent = task.title;
  document.getElementById('completeForm').reset();
  document.getElementById('cDate').value = todayStr();
  document.getElementById('errBy').style.display = 'none';
  overlayComplete.classList.add('active');
}
document.getElementById('btnCancelComplete').addEventListener('click', () => overlayComplete.classList.remove('active'));
overlayComplete.addEventListener('click', (e) => { if (e.target === overlayComplete) overlayComplete.classList.remove('active'); });

document.getElementById('completeForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const by = document.getElementById('cBy').value.trim();
  if (!by){ document.getElementById('errBy').style.display = 'block'; return; }
  document.getElementById('errBy').style.display = 'none';

  const task = DATA.tasks.find(t => t.id === pendingCompleteId);
  if (!task) return;
  const completedDate = document.getElementById('cDate').value || todayStr();

  DATA.log.push({
    id: uid(),
    taskId: task.id,
    taskTitle: task.title,
    completedDate,
    completedBy: by,
    notes: document.getElementById('cNotes').value.trim()
  });

  if (task.frequency && task.frequency > 0){
    task.nextDue = addDays(completedDate, task.frequency);
  } else {
    DATA.tasks = DATA.tasks.filter(t => t.id !== task.id);
  }

  saveData();
  renderAll();
  overlayComplete.classList.remove('active');
});

function deleteTask(id){
  DATA.tasks = DATA.tasks.filter(t => t.id !== id);
  saveData();
  renderAll();
}

loadData();
</script>
